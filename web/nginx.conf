# nginx del frontend: sirve Angular y reenvía /api/ a la API, que no tiene puertos publicados.
# Así el navegador solo habla con un origen (no hace falta CORS) y la API solo es accesible
# desde la red interna de docker-compose.
server {
    listen 8080;
    server_tokens off;                      # no anunciar la versión de nginx
    root /usr/share/nginx/html;

    include /etc/nginx/cabeceras-seguridad.conf;

    # Las preguntas tienen como mucho 500 caracteres: un cuerpo de 16 KB ya es abuso.
    client_max_body_size 16k;

    # DNS interno de Docker (redes definidas en docker-compose). Con el nombre de la API en una
    # variable, nginx lo resuelve en cada petición y no al arrancar: si el contenedor de la API no
    # existe o está parado, nginx arranca igual y responde el 503 de @api_no_responde, en vez de
    # fallar con "host not found in upstream" y reiniciarse en bucle.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_host api;

    location /api/ {
        # Se quita el prefijo: /api/buscar -> http://api:8000/buscar. Con una variable en
        # proxy_pass, nginx no lo quita solo, así que lo hace el rewrite.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Se sustituye (no se añade) la cabecera: la API recibe solo la IP real de quien
        # conecta con nginx, y lo que escriba el cliente en X-Forwarded-For se descarta.
        proxy_set_header X-Forwarded-For $remote_addr;
        # SSE: sin buffer, cada evento sale al navegador en cuanto la API lo manda.
        proxy_buffering off;
        # Algo más que TIMEOUT_PETICION_S (180 s) para que sea la API la que corte con un 504 claro.
        proxy_read_timeout 200s;

        # Si la API no acepta la conexión (está arrancando: ingesta y modelos; o se ha caído), nginx
        # generaría un 502 en HTML, o un 504 si la conexión se queda esperando. En su lugar, un 503
        # en JSON con el mismo formato que los errores de la API, que la web reconoce para enseñar el
        # aviso de arranque y volver a comprobar sola. Solo afecta a los errores que genera nginx:
        # los 502/504 que devuelva la propia API pasan tal cual (proxy_intercept_errors está apagado).
        proxy_connect_timeout 5s;
        error_page 502 504 =503 @api_no_responde;
    }

    location @api_no_responde {
        include /etc/nginx/cabeceras-seguridad.conf;
        add_header Retry-After "10" always;
        add_header Cache-Control "no-store" always;
        default_type "application/json; charset=utf-8";
        # nginx no puede saber si la API está arrancando o se ha caído: el mensaje cubre los dos casos.
        return 503 '{"error": "La API todavía no responde. Si el servidor acaba de arrancar, está preparando los documentos y los modelos (la primera vez, varios minutos).", "tipo": "arrancando"}';
    }

    location = /index.html {
        # El nonce cambia en cada petición, así que index.html nunca se guarda en caché.
        sub_filter_once off;
        sub_filter "CSP_NONCE" $request_id;
        add_header Cache-Control "no-store" always;
        # add_header en un location anula las del server: se vuelven a incluir aquí.
        include /etc/nginx/cabeceras-seguridad.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
