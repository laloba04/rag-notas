# nginx del frontend: sirve Angular y reenvía /api/ a la API, que no tiene puertos publicados.
# Así el navegador solo habla con un origen (no hace falta CORS) y la API solo es accesible
# desde la red interna de docker-compose.
server {
    listen 8080;
    server_tokens off;                      # no anunciar la versión de nginx
    root /usr/share/nginx/html;

    # Cabeceras de seguridad. Solo se permite lo del propio origen; los estilos que Angular mete
    # en la página tienen que llevar el nonce, que cambia en cada petición ($request_id).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Las preguntas tienen como mucho 500 caracteres: un cuerpo de 16 KB ya es abuso.
    client_max_body_size 16k;

    location /api/ {
        # La barra final quita el prefijo: /api/buscar -> http://api:8000/buscar
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Se sustituye (no se añade) la cabecera: la API recibe solo la IP real de quien
        # conecta con nginx, y lo que escriba el cliente en X-Forwarded-For se descarta.
        proxy_set_header X-Forwarded-For $remote_addr;
        # SSE: sin buffer, cada evento sale al navegador en cuanto la API lo manda.
        proxy_buffering off;
        # Algo más que TIMEOUT_PETICION_S (180 s) para que sea la API la que corte con un 504 claro.
        proxy_read_timeout 200s;
    }

    location = /index.html {
        # El nonce cambia en cada petición, así que index.html nunca se guarda en caché.
        sub_filter_once off;
        sub_filter "CSP_NONCE" $request_id;
        add_header Cache-Control "no-store" always;
        # add_header en un location anula las del server: se repiten aquí.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
