# Cabeceras de seguridad, incluidas en cada sitio que responde (nginx.conf). Van en un fichero
# aparte porque un add_header dentro de un location anula todos los del server: así no se repiten.
# Solo se permite lo del propio origen; los estilos que Angular mete en la página tienen que llevar
# el nonce, que cambia en cada petición ($request_id).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
