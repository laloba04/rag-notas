# Excepciones de Trivy. Solo para vulnerabilidades que NO afectan a este proyecto, nunca para tapar
# algo roto. Cada una lleva el motivo, la condición que la hace válida y una fecha de caducidad
# (expired_at). Al caducar, el CI vuelve a fallar y obliga a revisarla.
# Si la condición deja de cumplirse (p. ej. se activa HTTP/2 en web/nginx.conf), hay que quitar la excepción.
#
# Revisión del 2026-11-22. Arregladas en nginx 1.30.7 (2026-11-18), que aún no tiene dos semanas y
# para el que todavía no hay imagen nginx-unprivileged. Ninguna aplica a web/nginx.conf: un único
# server con "listen 8080" en HTTP/1.1 sin TLS, sin mail, sin HTTP/2 ni HTTP/3, sin SSI ni mirror,
# y proxy_pass a un nombre fijo (http://api:8000/, sin variables). Caducan el 2026-12-02: para
# entonces hay que pasar a la imagen de nginx 1.30.7.

vulnerabilities:
  - id: CVE-2026-113425
    purls: ["pkg:apk/alpine/nginx@1.30.6-r1?arch=x86_64&distro=3.24.2"]
    statement: >-
      Use-after-free en el proxy de correo (mail). Válida mientras web/nginx.conf no tenga bloque mail.
    expired_at: 2026-12-02
  - id: CVE-2026-121810
    purls: ["pkg:apk/alpine/nginx@1.30.6-r1?arch=x86_64&distro=3.24.2"]
    statement: >-
      Use-after-free con HTTP/3. Válida mientras ningún listen use quic ni http3.
    expired_at: 2026-12-02
  - id: CVE-2026-123007
    purls: ["pkg:apk/alpine/nginx@1.30.6-r1?arch=x86_64&distro=3.24.2"]
    statement: >-
      Desbordamiento de la ventana de control de flujo de HTTP/2. Válida mientras no se active http2.
    expired_at: 2026-12-02
  - id: CVE-2026-123633
    purls: ["pkg:apk/alpine/nginx@1.30.6-r1?arch=x86_64&distro=3.24.2"]
    statement: >-
      Use-after-free con HTTP/2 hacia los clientes y proxy al backend. Válida mientras no se active http2.
    expired_at: 2026-12-02
  - id: CVE-2026-118899
    purls: ["pkg:apk/alpine/nginx@1.30.6-r1?arch=x86_64&distro=3.24.2"]
    statement: >-
      Bucle infinito con TLS 1.3 en "listen ... ssl". Válida mientras nginx no termine TLS (escucha en
      HTTP plano; el TLS, si lo hay, lo pone el proveedor delante).
    expired_at: 2026-12-02
  - id: CVE-2026-123634
    purls: ["pkg:apk/alpine/nginx@1.30.6-r1?arch=x86_64&distro=3.24.2"]
    statement: >-
      Use-after-free en el resolver con proxy_pass con variables más SSI o mirror. Válida mientras
      proxy_pass apunte a un nombre fijo y no se usen ssi ni mirror.
    expired_at: 2026-12-02
