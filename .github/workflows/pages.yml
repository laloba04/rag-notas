# Demo grabada en GitHub Pages: la web de Angular compilada con la configuración "demo", que no
# llama a ninguna API y reproduce respuestas reales grabadas con scripts/grabar_demo.py
# (web/demo/grabaciones.json). La aplicación completa (API + web) es la de Docker; esto es solo una
# demo estática.
#
# Se publica en cada push a main que toque la web, o a mano. Primero pasan los tests de Angular.
# Acciones fijadas por commit (no por etiqueta, que se puede mover).

name: Demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Mínimo privilegio: por defecto, solo leer el repo. Solo el trabajo de publicar puede más.
permissions:
  contents: read

# Una publicación cada vez, y sin cortar una que esté a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    name: Tests y build "demo"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - run: npx ng build --configuration demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: web/dist/demo/browser

  publicar:
    name: Publicar en GitHub Pages
    needs: compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write        # publicar el sitio
      id-token: write     # para que Pages compruebe que la publicación viene de este workflow
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
